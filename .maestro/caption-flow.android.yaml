appId: com.altixcode.capflow
name: Caption a clip end to end (Android)
---
# Same contract as the iOS flow, against a different engine: transcription runs
# on a WAV produced by MediaCodec rather than AVAssetReader, and the burn is a
# MediaCodec GL pass rather than Core Image. One passing says nothing about the
# other, so both are gated the same way -- by reading the exported file back.
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: artifacts/android-01-home

- runFlow:
    when:
      visible: "Download Model"
    commands:
      - tapOn: "Download Model"
      - extendedWaitUntil:
          notVisible: ".*Downloading.*"
          timeout: 300000

- tapOn: "Choose a Video"
# Anchor on the picker's own chrome, not on text the app also has.
- extendedWaitUntil:
    visible: "Albums"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 6000
# Tapped by the cell's own accessibility label, not by position. The picker
# sheet opens to a height that depends on how many items it has to show, so a
# fixed percentage lands on the first cell with a full library and on empty
# space with a single one -- and a tap into empty space reports COMPLETED.
# qa-emulator.sh clears every app's fixtures, so this matches exactly one cell.
- tapOn: "Video taken on .*"

- extendedWaitUntil:
    visible: ".*1080x1920.*"
    timeout: 45000
- takeScreenshot: artifacts/android-02-loaded

- tapOn: "Write the Captions"
- extendedWaitUntil:
    visible: "Save to Photos"
    timeout: 600000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: artifacts/android-03-studio

- scrollUntilVisible:
    element:
      text: "Save to Photos"
    direction: DOWN
    timeout: 20000
- tapOn: "Save to Photos"
- runFlow:
    when:
      visible: ".*(Allow|ALLOW).*"
    commands:
      - tapOn: ".*(Allow|ALLOW).*"
- extendedWaitUntil:
    visible: "Saved!"
    timeout: 600000
- takeScreenshot: artifacts/android-04-saved
