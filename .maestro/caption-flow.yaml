appId: com.altixcode.capflow
name: Caption a clip end to end
---
# The fixture is a 5.5s portrait clip carrying real synthesised speech, with a
# moving light band behind the caption area. Silence would make every caption
# assertion pass vacuously, and a flat background would hide a missing outline.
- launchApp:
    clearState: false
- takeScreenshot: artifacts/01-home

# The model is a ~31 MB download on first launch. Skipped when a previous run
# already fetched it, since the card is gone once the model is on disk.
- runFlow:
    when:
      visible: "Download Model"
    commands:
      - tapOn: "Download Model"
      - extendedWaitUntil:
          notVisible: ".*Downloading.*"
          timeout: 300000

- tapOn: "Choose a Video"
# Anchor on the picker's own scroll view rather than visible text: a wait like
# ".*Photos.*" is also satisfied by the app's own copy, so it passes instantly
# and the tap below fires while the picker is still presenting.
- extendedWaitUntil:
    visible:
      id: "photosView_content_scroll_view"
    timeout: 30000
- extendedWaitUntil:
    visible: "Video, .*"
    timeout: 25000
# Let the grid finish laying out. The container carries the same accessibility
# label as its cells and appears first, so waiting on the label alone returns
# before any cell exists and the tap lands in empty space beside it.
- waitForAnimationToEnd:
    timeout: 8000
- tapOn:
    point: "64,206"

# Anchor on the loaded clip's own dimensions line. A looser ".*Video.*" also
# matches the empty state's "No Video Selected" and passes without a clip.
- extendedWaitUntil:
    visible: ".*1080x1920.*"
    timeout: 45000
- takeScreenshot: artifacts/02-loaded

- tapOn: "Write the Captions"
# Transcription runs whisper over the whole clip on device. The studio is
# reached only when it produced words, so this doubles as the assertion that
# it did.
- extendedWaitUntil:
    visible: "Save to Photos"
    timeout: 300000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: artifacts/03-studio

# Scrolled to rather than tapped blind: the export button sits below a
# full-height video preview on a short screen.
- scrollUntilVisible:
    element:
      text: "Save to Photos"
    direction: DOWN
    timeout: 20000
- tapOn: "Save to Photos"
# Full read-and-write photo access, which iOS refuses without a prompt when
# only add-access was requested.
- runFlow:
    when:
      visible: ".*Allow Access to All Photos.*"
    commands:
      - tapOn: ".*Allow Access to All Photos.*"
# Assert the success alert by its own text. A loose ".*OK.*" also matches the
# denial alert, so a refused save used to read as a pass.
- extendedWaitUntil:
    visible: "Saved!"
    timeout: 300000
- takeScreenshot: artifacts/04-saved
